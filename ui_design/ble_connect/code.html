<script>
  (function() {
    const CONFIG_USE_TIMER = true; 
    const isInjecting = localStorage.getItem('isInjecting') === 'true';
    const currentPath = window.location.pathname;
    const preventPaths = ['meal_injection', 'add_injection', 'dining', 'exercise'];
    const isPreventPath = preventPaths.some(path => currentPath.includes(path));
    
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-[13px] px-5 py-3 rounded-full shadow-lg z-[9999] transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-none whitespace-nowrap font-medium';
      toast.innerText = message;
      document.body.appendChild(toast);
      
      toast.offsetHeight;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }
    
    if (isInjecting && isPreventPath) {
      localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
      window.location.href = '../dashboard/code.html';
      return;
    }
    
    let activeTimer = null;
    
    function checkInjectingStatus() {
      const activeInjecting = localStorage.getItem('isInjecting') === 'true';
      if (!activeInjecting) {
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        return;
      }
      
      const endTime = parseInt(localStorage.getItem('injectingEndTime') || '0', 10);
      const now = Date.now();
      const useTimer = CONFIG_USE_TIMER && (localStorage.getItem('CONFIG_USE_TIMER') !== 'false');
      
      if (useTimer && endTime > 0) {
        if (now >= endTime) {
          triggerComplete();
        } else {
          const delay = endTime - now;
          if (activeTimer) clearTimeout(activeTimer);
          activeTimer = setTimeout(triggerComplete, delay);
        }
      }
    }
    
    function triggerComplete() {
      console.log('BLE 수신 시뮬레이션: BT_INJ_STOP_IND (0x3B) 주입 완료 수신');
      localStorage.setItem('isInjecting', 'false');
      localStorage.removeItem('injectingEndTime');
      localStorage.setItem('showCompleteModal', 'true');
      window.location.href = '../dashboard/code.html';
    }
    
    function init() {
      const pendingToast = localStorage.getItem('showToastMsg');
      if (pendingToast) {
        localStorage.removeItem('showToastMsg');
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => showToast(pendingToast));
        } else {
          showToast(pendingToast);
        }
      }
      checkInjectingStatus();
    }
    
    init();
    
    window.addEventListener('storage', (e) => {
      if (e.key === 'isInjecting') {
        const updatedInjecting = localStorage.getItem('isInjecting') === 'true';
        if (updatedInjecting && isPreventPath) {
          localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
          window.location.href = '../dashboard/code.html';
        } else if (!updatedInjecting && isInjecting && !isPreventPath) {
          localStorage.setItem('showCompleteModal', 'true');
          window.location.href = '../dashboard/code.html';
        }
      }
      if (e.key === 'isInjecting' || e.key === 'injectingEndTime' || e.key === 'CONFIG_USE_TIMER') {
        checkInjectingStatus();
      }
    });
  })();
</script>

<body class="bg-mesh text-on-surface font-body-md border-x border-slate-100 shadow-2xl">
<div id="root"></div>
<script type="text/babel">
        const { useState, useEffect } = React;

        const mockDevice = { 
            name: 'HealUS', 
            mac: '20:73:6A:19:3E:41', 
            signal: '신호 강함' 
        };

        function App() {
            const [currentStep, setCurrentStep] = useState('searching');
            const [showPermissionBox, setShowPermissionBox] = useState(true);
            const [foundDevices, setFoundDevices] = useState([]);
            const [toast, setToast] = useState(null);

            useEffect(() => {
                window.updateFoundDevices = (devices) => {
                    setFoundDevices(devices);
                };
                return () => {
                    delete window.updateFoundDevices;
                };
            }, []);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const handleAllow = () => {
                setShowPermissionBox(false);
                setFoundDevices([]);
                console.log("BLE Command Sent: [START_SCAN]");
            };

            const handleDeny = () => {
                setShowPermissionBox(false);
                try {
                    window.close();
                } finally {
                    if (!window.closed) {
                        window.location.replace('about:blank');
                    }
                }
            };

            const handleDeviceClick = (device) => {
                window.location.assign(`../password/code.html?mac=${encodeURIComponent(device.mac)}`);
            };

            return (
                <div className="h-full w-full relative bg-mesh overflow-hidden">
                    {/* TopAppBar */}
                    <div className="h-16 w-full shrink-0">
                        <div className="flex items-center px-4 h-full">
                            <div className="flex items-center gap-2 group">
                                <div className="w-10 h-10 bg-primary/10 rounded-lg flex items-center justify-center text-primary">
                                    <span className="material-symbols-outlined" style={{fontVariationSettings: "'FILL' 1"}}>monitor_heart</span>
                                </div>
                                <span className="font-display text-lg font-bold text-on-surface">HealUs</span>
                            </div>
                        </div>
                    </div>

                    <main className="w-full px-margin-mobile pt-sm pb-8 space-y-6">
                        {currentStep === 'searching' ? (
                            <>
                                {/* Alert Banner */}
                                <div className="mt-xs bg-error-container/40 border border-error/10 rounded-xl p-4 flex items-start gap-3">
                                    <span className="material-symbols-outlined text-error" style={{fontVariationSettings: "'FILL' 1"}}>warning</span>
                                    <div>
                                        <h3 className="text-error font-label-sm uppercase tracking-wider">조치가 필요함</h3>
                                        <p className="text-on-error-container text-[13px] whitespace-nowrap font-medium mt-1">서비스를 이용하려면 장치 연결이 필요합니다</p>
                                    </div>
                                </div>

                                {/* Search Status Section */}
                                <div className="relative overflow-hidden bg-white rounded-3xl p-8 shadow-sm border border-outline-variant/30 text-center space-y-4">
                                    <div className="relative w-24 h-24 mx-auto mb-6 flex items-center justify-center">
                                        <div className={`absolute inset-0 border-2 border-primary/20 rounded-full ${!showPermissionBox && foundDevices.length === 0 ? 'animate-ping' : ''}`}></div>
                                        <div className="absolute inset-0 border-2 border-primary/10 rounded-full scale-125 opacity-20"></div>
                                        <div className="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center">
                                            <span className="material-symbols-outlined text-primary text-4xl">bluetooth_searching</span>
                                        </div>
                                    </div>
                                    <h2 className="font-headline-md text-headline-md text-on-background">장치 선택</h2>
                                    <div className="flex items-center justify-center gap-2 text-primary h-6">
                                        {!showPermissionBox && foundDevices.length === 0 && (
                                            <span className="material-symbols-outlined animate-spin text-sm">progress_activity</span>
                                        )}
                                        <span className="font-label-sm">
                                            {showPermissionBox ? '대기 중...' : (foundDevices.length === 0 ? '검색 중...' : '검색 완료')}
                                        </span>
                                    </div>
                                    <p className="text-on-surface-variant font-body-md px-4">인슐린 펌프가 페어링 모드이고 근처에 있는지 확인하세요.</p>
                                </div>

                                {/* Devices List */}
                                <div className="space-y-3">
                                    <div className="flex items-center justify-between px-1">
                                        <span className="font-label-sm text-on-surface-variant uppercase tracking-widest">장치를 선택해주세요</span>
                                    </div>
                                    
                                    {foundDevices.map((device, index) => (
                                        <button 
                                            key={index}
                                            onClick={() => handleDeviceClick(device)}
                                            className="w-full bg-white border border-outline-variant/30 p-4 rounded-2xl flex items-center gap-4 hover:border-primary/50 transition-all active:scale-[0.98] shadow-sm cursor-pointer group"
                                        >
                                            <div className="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center text-primary group-hover:bg-primary/5">
                                                <span className="material-symbols-outlined" style={{fontVariationSettings: "'FILL' 1"}}>monitor_heart</span>
                                            </div>
                                            <div className="flex-1 text-left">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-headline-md text-body-lg text-on-surface">{device.name}</span>
                                                    <span className="bg-primary/10 text-primary text-[10px] font-bold px-1.5 py-0.5 rounded-md uppercase">{device.signal}</span>
                                                </div>
                                                <code className="text-on-surface-variant font-label-sm tracking-tighter">{device.mac}</code>
                                            </div>
                                            <span className="material-symbols-outlined text-outline-variant">chevron_right</span>
                                        </button>
                                    ))}
                                    
                                    {foundDevices.length === 0 && !showPermissionBox && (
                                        <div className="p-8 text-center text-on-surface-variant font-body-md">
                                            발견된 장치가 없습니다.
                                        </div>
                                    )}
                                </div>
                            </>
                        ) : (
                            /* Password Step Placeholder */
                            <div className="flex flex-col items-center justify-center py-12 space-y-6 animate-[slideUp_0.3s_ease-out]">
                                <div className="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center text-primary">
                                    <span className="material-symbols-outlined text-4xl">lock</span>
                                </div>
                                <div className="text-center space-y-2">
                                    <h2 className="font-headline-md text-on-background">비밀번호 입력</h2>
                                    <p className="text-on-surface-variant">펌프 화면에 표시된 PIN 번호를 입력하세요</p>
                                </div>
                                <div className="flex gap-3 justify-center">
                                    {[1, 2, 3, 4, 5, 6].map(i => (
                                        <div key={i} className="w-10 h-14 bg-white border border-outline-variant/30 rounded-xl flex items-center justify-center shadow-sm">
                                            <div className="w-2 h-2 bg-outline-variant rounded-full"></div>
                                        </div>
                                    ))}
                                </div>
                                <button 
                                    onClick={() => setCurrentStep('searching')}
                                    className="text-primary font-medium flex items-center gap-1 mt-4"
                                >
                                    <span className="material-symbols-outlined text-sm">arrow_back</span>
                                    장치 재검색
                                </button>
                            </div>
                        )}

                    {/* Toast Message */}
                    {toast && (

                            {toast}
                        </div>
                    )}

                    {/* Permission Bottom Sheet Modal */}
                    {showPermissionBox && (
                        <div className="absolute inset-0 bg-black/40 z-50 flex flex-col justify-end">
                            <div className="bg-slate-800 rounded-t-3xl p-6 w-full animate-[slideUp_0.3s_ease-out] shadow-[0_-8px_20px_rgba(0,0,0,0.2)]">
                                <h3 className="text-white font-headline-md mb-8 leading-tight">
                                    HealUS에서 블루투스 켜기를 요청합니다.
                                </h3>
                                <div className="flex gap-4">
                                    <button 
                                        onClick={handleDeny}
                                        className="flex-1 py-4 px-4 rounded-2xl font-bold text-white bg-slate-700 hover:bg-slate-600 active:bg-slate-500 transition-colors"
                                    >
                                        거부
                                    </button>
                                    <button 
                                        onClick={handleAllow}
                                        className="flex-1 py-4 px-4 rounded-2xl font-bold text-white bg-primary hover:bg-primary/90 active:bg-primary/80 transition-colors"
                                    >
                                        허용
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
