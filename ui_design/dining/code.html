  <script>
    (function () {
      const CONFIG_USE_TIMER = true;
      const isInjecting = localStorage.getItem('isInjecting') === 'true';
      const currentPath = window.location.pathname;
      const preventPaths = ['meal_injection', 'add_injection', 'dining', 'exercise'];
      const isPreventPath = preventPaths.some(path => currentPath.includes(path));

      window.showToast = function (message) {
        const toast = document.createElement('div');
        toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-[13px] px-5 py-3 rounded-full shadow-lg z-[9999] transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-none whitespace-nowrap font-medium';
        toast.innerText = message;
        document.body.appendChild(toast);

        toast.offsetHeight;
        toast.classList.remove('opacity-0', 'translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');

        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }, 2000);
      };

      if (isInjecting && isPreventPath) {
        localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
        window.location.href = '../dashboard/code.html';
        return;
      }

      let activeTimer = null;

      function checkInjectingStatus() {
        const activeInjecting = localStorage.getItem('isInjecting') === 'true';
        if (!activeInjecting) {
          if (activeTimer) {
            clearTimeout(activeTimer);
            activeTimer = null;
          }
          return;
        }

        const endTime = parseInt(localStorage.getItem('injectingEndTime') || '0', 10);
        const now = Date.now();
        const useTimer = CONFIG_USE_TIMER && (localStorage.getItem('CONFIG_USE_TIMER') !== 'false');

        if (useTimer && endTime > 0) {
          if (now >= endTime) {
            triggerComplete();
          } else {
            const delay = endTime - now;
            if (activeTimer) clearTimeout(activeTimer);
            activeTimer = setTimeout(triggerComplete, delay);
          }
        }
      }

      function triggerComplete() {
        console.log('BLE 수신 시뮬레이션: BT_INJ_STOP_IND (0x3B) 주입 완료 수신');
        localStorage.setItem('isInjecting', 'false');
        localStorage.removeItem('injectingEndTime');
        localStorage.setItem('showCompleteModal', 'true');
        window.location.href = '../dashboard/code.html';
      }

      function init() {
        const pendingToast = localStorage.getItem('showToastMsg');
        if (pendingToast) {
          localStorage.removeItem('showToastMsg');
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => showToast(pendingToast));
          } else {
            showToast(pendingToast);
          }
        }
        checkInjectingStatus();
      }

      init();

      window.addEventListener('storage', (e) => {
        if (e.key === 'isInjecting') {
          const updatedInjecting = localStorage.getItem('isInjecting') === 'true';
          if (updatedInjecting && isPreventPath) {
            localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
            window.location.href = '../dashboard/code.html';
          } else if (!updatedInjecting && isInjecting && !isPreventPath) {
            localStorage.setItem('showCompleteModal', 'true');
            window.location.href = '../dashboard/code.html';
          }
        }
        if (e.key === 'isInjecting' || e.key === 'injectingEndTime' || e.key === 'CONFIG_USE_TIMER') {
          checkInjectingStatus();
        }
      });
    })();
  </script>

  style="height: 100vh; max-width: 390px; width: 100%; margin: 0 auto; overflow: hidden;">
  <!-- Mobile Container Wrapper -->

    <!-- TopAppBar -->

        회식 적용

    </header>
    <!-- Main Content Area -->

        <p class="font-body-sm text-[11px] leading-tight text-on-surface-variant font-medium break-keep"><span class=""
            style="color: rgb(63, 72, 73); font-family: Inter;">-회식적용은 식사설정에 예약된 단위수를 비교적 적절한 회식시간을 추정하여 나누어 주입하는

            class="" style="color: rgb(63, 72, 73); font-family: Inter;">-회식시간을 1시간~8시간까지 설정, 회식시간 중 인슐린 양과 횟수를 실행 또는

              <option selected="" value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>

        class="flex-1 bg-[#1f6568] text-white font-semibold text-[14px] leading-[20px] rounded-full hover:opacity-90 transition-opacity active:scale-[0.98] h-[56px]"
        id="applyBtn">
        회식적용
      </button>
      <button
        class="flex-1 bg-[#e6e8e9] text-[#191c1d] font-semibold text-[14px] leading-[20px] rounded-full hover:opacity-80 transition-opacity active:scale-[0.98] h-[56px]"
        id="closeBtn">
        닫기
      </button>
    </footer>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const timeSetting = document.getElementById('timeSetting');
      const applyBtn = document.getElementById('applyBtn');
      const closeBtn = document.getElementById('closeBtn');
      const breakfastInput = document.getElementById('breakfast-val');
      const lunchInput = document.getElementById('lunch-val');
      const dinnerInput = document.getElementById('dinner-val');

      // Load setting values from localStorage
      try {
        const saved = window.localStorage.getItem('meal_settings');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.breakfast) breakfastInput.value = parsed.breakfast;
          if (parsed.lunch) lunchInput.value = parsed.lunch;
          if (parsed.dinner) dinnerInput.value = parsed.dinner;
        }
      } catch (e) {
        console.error('Failed to load meal settings', e);
      }

      const goToDashboard = (params = {}) => {
        const query = new URLSearchParams(params).toString();
        window.location.href = `../dashboard/code.html${query ? `?${query}` : ''}`;
      };

      applyBtn.addEventListener('click', () => {
        const finalValue = timeSetting.value;

        applyBtn.disabled = true;
        applyBtn.classList.add('opacity-70', 'cursor-not-allowed');

        console.log(`BLE 명령 전송: SEND_DINING_COMMAND: ${finalValue}시간`);

        window.onInjectionApproved = () => {
          applyBtn.disabled = false;
          applyBtn.classList.remove('opacity-70', 'cursor-not-allowed');
          localStorage.setItem('isInjecting', 'true');
          localStorage.setItem('injectingEndTime', (Date.now() + 5000).toString());
          const payload = encodeURIComponent(JSON.stringify({
            time: finalValue,
            breakfast: breakfastInput.value,
            lunch: lunchInput.value,
            dinner: dinnerInput.value
          }));
          goToDashboard({
            modal: 'request',
            action: 'dining',
            payload
          });
        };

        window.onInjectionRejected = () => {
          applyBtn.disabled = false;
          applyBtn.classList.remove('opacity-70', 'cursor-not-allowed');
          localStorage.setItem('isInjecting', 'false');
          localStorage.setItem('showToastMsg', '주입 요청을 취소합니다.');
          if (typeof showToast === 'function') {
            showToast('주입 요청을 취소합니다.');
            localStorage.removeItem('showToastMsg');
          } else if (typeof window.showToast === 'function') {
            window.showToast('주입 요청을 취소합니다.');
            localStorage.removeItem('showToastMsg');
          }
        };
      });

      closeBtn.addEventListener('click', () => {
        goToDashboard();
      });
    });
  </script>
