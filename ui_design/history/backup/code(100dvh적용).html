<!DOCTYPE html><html lang="ko"><head>
<script>
  (function() {
    const CONFIG_USE_TIMER = true; 
    const isInjecting = localStorage.getItem('isInjecting') === 'true';
    const currentPath = window.location.pathname;
    const preventPaths = ['meal_injection', 'add_injection', 'dining', 'exercise'];
    const isPreventPath = preventPaths.some(path => currentPath.includes(path));
    
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-[13px] px-5 py-3 rounded-full shadow-lg z-[9999] transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-none whitespace-nowrap font-medium';
      toast.innerText = message;
      document.body.appendChild(toast);
      
      toast.offsetHeight;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }
    
    if (isInjecting && isPreventPath) {
      localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
      window.location.href = '../dashboard/code.html';
      return;
    }
    
    let activeTimer = null;
    
    function checkInjectingStatus() {
      const activeInjecting = localStorage.getItem('isInjecting') === 'true';
      if (!activeInjecting) {
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        return;
      }
      
      const endTime = parseInt(localStorage.getItem('injectingEndTime') || '0', 10);
      const now = Date.now();
      const useTimer = CONFIG_USE_TIMER && (localStorage.getItem('CONFIG_USE_TIMER') !== 'false');
      
      if (useTimer && endTime > 0) {
        if (now >= endTime) {
          triggerComplete();
        } else {
          const delay = endTime - now;
          if (activeTimer) clearTimeout(activeTimer);
          activeTimer = setTimeout(triggerComplete, delay);
        }
      }
    }
    
    function triggerComplete() {
      console.log('BLE 수신 시뮬레이션: BT_INJ_STOP_IND (0x3B) 주입 완료 수신');
      localStorage.setItem('isInjecting', 'false');
      localStorage.removeItem('injectingEndTime');
      localStorage.setItem('showCompleteModal', 'true');
      window.location.href = '../dashboard/code.html';
    }
    
    function init() {
      const pendingToast = localStorage.getItem('showToastMsg');
      if (pendingToast) {
        localStorage.removeItem('showToastMsg');
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => showToast(pendingToast));
        } else {
          showToast(pendingToast);
        }
      }
      checkInjectingStatus();
    }
    
    init();
    
    window.addEventListener('storage', (e) => {
      if (e.key === 'isInjecting') {
        const updatedInjecting = localStorage.getItem('isInjecting') === 'true';
        if (updatedInjecting && isPreventPath) {
          localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
          window.location.href = '../dashboard/code.html';
        } else if (!updatedInjecting && isInjecting && !isPreventPath) {
          localStorage.setItem('showCompleteModal', 'true');
          window.location.href = '../dashboard/code.html';
        }
      }
      if (e.key === 'isInjecting' || e.key === 'injectingEndTime' || e.key === 'CONFIG_USE_TIMER') {
        checkInjectingStatus();
      }
    });
  })();
</script>

<script>
  const CENTER_VALUES = {
    base: 1.5,
    meal: 2.05,
    add: 1.0
  };

  const COLORS = {
    base: '#a5b4fc',
    meal: '#a7f3d0',
    add: '#fde68a'
  };

  const MAX_STACK_VALUE = 100; // U 단위 최대 기준치 100 U
  
  // 현재 중심 선택 날짜 관리 변수 (기본값 오늘)
  let currentSelectedDate = new Date();
  // 달력 팝업 내에서 임시로 보여주는 년/월 상태 변수
  let calendarActiveDate = new Date();

  // DOM 요소 참조 변수
  let chartDateRow, barContainer, valueRowAdd, valueRowMeal, valueRowBase;
  let refreshButton, prevButton, nextButton;
  let dateDisplayBtn, selectedDateText, calendarDropdown;
  let calPrevMonth, calNextMonth, calMonthYearText, calDaysGrid;

  function toInputDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  // Helper: 날짜 연산
  function addDays(date, offset) {
    const next = new Date(date);
    next.setDate(next.getDate() + offset);
    return next;
  }

  function formatDateLabel(date) {
    return `${date.getMonth() + 1}/${date.getDate()}`;
  }

  // YYYY년 MM월 DD일 한글 날짜 포맷
  function formatKoreanDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}년 ${month}월 ${day}일`;
  }

  function buildSeries(centerDate) {
    const series = [];
    const logsStr = localStorage.getItem('history_logs');
    let dbLogs = [];
    try {
      if (logsStr) dbLogs = JSON.parse(logsStr);
    } catch(e) {
      console.error("Failed to parse history_logs", e);
    }

    for (let offset = -4; offset <= 0; offset += 1) {
      const currentDate = addDays(centerDate, offset);
      const m = currentDate.getMonth() + 1;
      const d = currentDate.getDate();
      
      // 일치하는 로그 매칭 검색
      const match = dbLogs.find(log => log.month === m && log.day === d);
      
      if (match) {
        series.push({
          date: currentDate,
          values: {
            base: match.base_total,
            meal: match.eat_total,
            evening: match.append_total, // 추가 주입 데이터 스케일 일치
            add: match.append_total // 테이블 표시용
          }
        });
      } else {
        series.push({
          date: currentDate,
          values: {
            base: 0.0,
            meal: 0.0,
            evening: 0.0,
            add: 0.0
          }
        });
      }
    }
    return series;
  }

  // 커스텀 달력 렌더링 함수
  function renderCalendarGrid() {
    if (!calMonthYearText || !calDaysGrid) return;

    const year = calendarActiveDate.getFullYear();
    const month = calendarActiveDate.getMonth(); // 0-indexed
    
    calMonthYearText.textContent = `${year}년 ${month + 1}월`;
    
    // 해당 월의 첫 날 요일과 마지막 일 수 구하기
    const firstDayIndex = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    
    // 이전 달의 마지막 일 수 구하기 (빈 칸 채우기 용)
    const prevMonthLastDate = new Date(year, month, 0).getDate();
    
    let html = '';
    
    // 1. 이전 달 날짜 채우기 (opacity 처리)
    for (let i = firstDayIndex - 1; i >= 0; i--) {
      const d = prevMonthLastDate - i;
      html += `<span class="py-1 text-gray-300 pointer-events-none">${d}</span>`;
    }
    
    // 2. 이번 달 날짜 채우기
    for (let d = 1; d <= lastDate; d++) {
      const curDate = new Date(year, month, d);
      const isSelected = toInputDate(curDate) === toInputDate(currentSelectedDate);
      const isToday = toInputDate(curDate) === toInputDate(new Date());
      
      let styleClass = "py-1 cursor-pointer rounded-full transition-colors hover:bg-teal-50 hover:text-teal-700 ";
      if (isSelected) {
        styleClass += "bg-[#509194] text-white hover:bg-[#509194] hover:text-white font-bold";
      } else if (isToday) {
        styleClass += "border border-[#509194] text-[#509194] font-medium";
      } else {
        const dayOfWeek = curDate.getDay();
        if (dayOfWeek === 0) styleClass += "text-red-500";
        else if (dayOfWeek === 6) styleClass += "text-blue-500";
        else styleClass += "text-gray-700";
      }
      
      html += `<span class="${styleClass}" onclick="selectCalendarDate(${year}, ${month}, ${d})">${d}</span>`;
    }
    
    calDaysGrid.innerHTML = html;
  }

  // 달력 내부 날짜 선택 처리 (글로벌 스코프에 노출)
  window.selectCalendarDate = function(year, month, day) {
    currentSelectedDate = new Date(year, month, day);
    calendarActiveDate = new Date(year, month, 1);
    if (calendarDropdown) {
      calendarDropdown.classList.remove('active');
    }
    renderChart();
  };

  function renderChart() {
    // 텍스트 라벨 년/월/일로 반영
    if (selectedDateText) {
      selectedDateText.textContent = formatKoreanDate(currentSelectedDate);
    }

    const series = buildSeries(currentSelectedDate);

    if (chartDateRow) {
      chartDateRow.innerHTML = series
        .map((item, index) => {
          const isCenter = index === series.length - 1;
          return `<span class="text-center ${isCenter ? 'text-gray-800 font-semibold' : ''}">${formatDateLabel(item.date)}</span>`;
        })
        .join('');
    }

    if (barContainer) {
      barContainer.innerHTML = series
        .map((item) => {
          const base = item.values.base || 0;
          const meal = item.values.meal || 0;
          const evening = item.values.evening || 0;
          const total = base + meal + evening;

          if (total === 0) {
            return `<div class="w-8 h-full flex flex-col justify-end"></div>`;
          }

          const totalHeight = (total / MAX_STACK_VALUE) * 100;
          const basePct = (base / total) * 100;
          const mealPct = (meal / total) * 100;
          const eveningPct = (evening / total) * 100;

          return `
            <div class="w-8 flex flex-col justify-end rounded-t-[2px] overflow-hidden" style="height:${Math.min(100, totalHeight)}%;">
              <div class="w-full" style="height:${eveningPct}%; background:${COLORS.add};" title="추가/저녁: ${evening.toFixed(2)}U"></div>
              <div class="w-full" style="height:${mealPct}%; background:${COLORS.meal};" title="식사: ${meal.toFixed(2)}U"></div>
              <div class="w-full" style="height:${basePct}%; background:${COLORS.base};" title="기초: ${base.toFixed(2)}U"></div>
            </div>`;
        })
        .join('');
    }

    if (valueRowAdd) {
      valueRowAdd.innerHTML = series
        .map((item) => `<td class="border border-gray-200 p-1 text-center">${item.values.add.toFixed(2)}</td>`)
        .join('');
    }
    
    if (valueRowMeal) {
      valueRowMeal.innerHTML = series
        .map((item) => `<td class="border border-gray-200 p-1 text-center">${item.values.meal.toFixed(2)}</td>`)
        .join('');
    }
    
    if (valueRowBase) {
      valueRowBase.innerHTML = series
        .map((item) => `<td class="border border-gray-200 p-1 text-center">${item.values.base.toFixed(2)}</td>`)
        .join('');
    }
  }

  function shiftCenterDate(offsetDays) {
    currentSelectedDate = addDays(currentSelectedDate, offsetDays);
    calendarActiveDate = new Date(currentSelectedDate.getFullYear(), currentSelectedDate.getMonth(), 1);
    renderChart();
  }

  function updateSummaryFromLocalStorage() {
    const localBasal = localStorage.getItem('basalSum') || '---';
    const localMeal = localStorage.getItem('mealSum') || '---';
    const localAppend = localStorage.getItem('appendSum') || '---';
    
    const basalEl = document.getElementById('summary-basal');
    const mealEl = document.getElementById('summary-meal');
    const appendEl = document.getElementById('summary-append');
    
    if (basalEl) basalEl.textContent = `기초 ${localBasal}`;
    if (mealEl) mealEl.textContent = `식사 ${localMeal}`;
    if (appendEl) appendEl.textContent = `추가 ${localAppend}`;
  }

  window.receiveBleHistoryLogs = function(logsJson) {
    console.log("Webview received history logs:", logsJson);
    try {
      localStorage.setItem('history_logs', logsJson);
      renderChart();
    } catch(e) {
      console.error(e);
    }
  };

  // DOM 완료 후 명시적 초기화 수행
  document.addEventListener('DOMContentLoaded', () => {
    chartDateRow = document.getElementById('chart-date-row');
    barContainer = document.getElementById('bar-container');
    valueRowAdd = document.getElementById('value-row-add');
    valueRowMeal = document.getElementById('value-row-meal');
    valueRowBase = document.getElementById('value-row-base');
    refreshButton = document.getElementById('refresh-btn');
    prevButton = document.getElementById('prev-5-days');
    nextButton = document.getElementById('next-5-days');
    
    dateDisplayBtn = document.getElementById('date-display-btn');
    selectedDateText = document.getElementById('selected-date-text');
    calendarDropdown = document.getElementById('custom-calendar-dropdown');
    calPrevMonth = document.getElementById('cal-prev-month');
    calNextMonth = document.getElementById('cal-next-month');
    calMonthYearText = document.getElementById('cal-month-year-text');
    calDaysGrid = document.getElementById('cal-days-grid');

    // 요약 정보 로드
    updateSummaryFromLocalStorage();

    // 캘린더 드롭다운 토글
    if (dateDisplayBtn) {
      dateDisplayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        calendarActiveDate = new Date(currentSelectedDate.getFullYear(), currentSelectedDate.getMonth(), 1);
        renderCalendarGrid();
        if (calendarDropdown) {
          calendarDropdown.classList.toggle('active');
        }
      });
    }

    // 달력 외부 클릭 시 닫기
    document.addEventListener('click', (e) => {
      if (calendarDropdown && dateDisplayBtn) {
        if (!calendarDropdown.contains(e.target) && e.target !== dateDisplayBtn) {
          calendarDropdown.classList.remove('active');
        }
      }
    });

    // 달력 내 이전달/다음달 이동 버튼
    if (calPrevMonth) {
      calPrevMonth.addEventListener('click', (e) => {
        e.stopPropagation();
        calendarActiveDate.setMonth(calendarActiveDate.getMonth() - 1);
        renderCalendarGrid();
      });
    }
    if (calNextMonth) {
      calNextMonth.addEventListener('click', (e) => {
        e.stopPropagation();
        calendarActiveDate.setMonth(calendarActiveDate.getMonth() + 1);
        renderCalendarGrid();
      });
    }

    if (refreshButton) {
      refreshButton.addEventListener('click', () => {
        console.log("REQUEST_HISTORY_LOGS");
      });
    }

    if (prevButton) {
      prevButton.addEventListener('click', () => shiftCenterDate(-5));
    }
    if (nextButton) {
      nextButton.addEventListener('click', () => shiftCenterDate(5));
    }
    
    // 최초 렌더링
    renderChart();
  });
</script>
</body></html>
