        extend: {

              DEFAULT: '#2A6062',

<style data-purpose="custom-utilities">
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #F5F7F8;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Hide scrollbar for clean mobile look */
    ::-webkit-scrollbar {
      display: none;
    }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    
    .progress-bar-bg {
      background-color: #EAF3F3;
    }
    
    .progress-bar-fill {
      background-color: #2A6062;
      transition: width 0.5s ease-in-out;
    }
    
    .icon-box {
      background-color: #EAF3F3;
      color: #2A6062;
    }

    /* Modal Overlays */
    .modal-overlay {
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }
  </style>

<script data-purpose="dashboard-logic">
    // 최종 빌드 시 false로 설정하여 시뮬레이션 타이머를 비활성화할 수 있습니다.
    const CONFIG_USE_TIMER = true;
    // localStorage.removeItem('CONFIG_USE_TIMER');

    const ACTION_SCREEN_PATHS = {
      meal: '../meal_injection/code.html',
      extra: '../add_injection/code.html',
      dining: '../dining/code.html',
      exercise: '../exercise/code.html'
    };

    let globalState = {
      isInjecting: false,
      activeModal: null,
      pendingAction: null,
      pendingPayload: null,
      completionTimer: null
    };

    // 토스트 UI 표시 함수
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-[13px] px-5 py-3 rounded-full shadow-lg z-[9999] transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-none whitespace-nowrap font-medium';
      toast.innerText = message;
      document.body.appendChild(toast);
      
      toast.offsetHeight; // force reflow
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    window.showAppToast = showToast;
    window.showToast = showToast;

    function navigateToAction(actionKey) {
      if (localStorage.getItem('isInjecting') === 'true') {
        showToast('주입 중에서 수행할 수 없습니다');
        return;
      }
      const targetPath = ACTION_SCREEN_PATHS[actionKey];
      if (!targetPath) {
        return;
      }
      window.location.href = targetPath;
    }

    window.navigateToAction = navigateToAction;

    function resetDashboardUrl() {
      history.replaceState(null, '', window.location.pathname);
    }

    function parsePendingPayload(rawPayload) {
      if (!rawPayload) {
        return {};
      }

      try {
        return JSON.parse(decodeURIComponent(rawPayload));
      } catch (error) {
        return {};
      }
    }

    function buildCommandText(action, payload) {
      const parsed = parsePendingPayload(payload);

      if (action === 'meal') {
        return `BLE 명령 전송: SEND_MEAL_INJECTION_COMMAND: ${parsed.breakfast || '1.00'} U 아침, ${parsed.lunch || '1.00'} U 점심, ${parsed.dinner || '1.00'} U 저녁`;
      }

      if (action === 'extra') {
        return `BLE 명령 전송: SEND_ADD_INJECTION_COMMAND: ${parsed.value || '0.00'} U`;
      }

      if (action === 'dining') {
        return `BLE 명령 전송: SEND_DINING_COMMAND: ${parsed.time || '1'}시간`;
      }

      if (action === 'exercise') {
        return `BLE 명령 전송: SEND_EXERCISE_COMMAND: ${parsed.time || '1'}시간, ${parsed.reduction || '20'}% 감소`;
      }

      return 'BLE 명령 전송: UNKNOWN_COMMAND';
    }

    function clearPendingRequest() {
      globalState.pendingAction = null;
      globalState.pendingPayload = null;
    }

    function openModal(modalType) {
      closeAllModals();
      globalState.activeModal = modalType;
      const modalEl = document.getElementById(`${modalType}-modal`);
      if (modalEl) {
        modalEl.classList.add('active');
      }
    }

    function closeAllModals() {
      document.querySelectorAll('.modal-overlay').forEach(el => {
        el.classList.remove('active');
      });
      globalState.activeModal = null;
    }

    function updateInjectingBadge() {
      const badge = document.getElementById('badge-injecting');
      if (!badge) {
        return;
      }

      if (globalState.isInjecting) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function clearCompletionSimulation() {
      if (globalState.completionTimer) {
        clearTimeout(globalState.completionTimer);
        globalState.completionTimer = null;
      }
    }

    function triggerComplete() {
      console.log('BLE 수신 시뮬레이션: BT_INJ_STOP_IND (0x3B) 주입 완료 수신');
      globalState.completionTimer = null;
      openModal('complete');
      globalState.isInjecting = false;
      localStorage.setItem('isInjecting', 'false');
      localStorage.removeItem('injectingEndTime');
      updateInjectingBadge();
    }

    function scheduleCompletionSimulation() {
      clearCompletionSimulation();
      const useTimer = CONFIG_USE_TIMER && (localStorage.getItem('CONFIG_USE_TIMER') !== 'false');
      if (!useTimer) return;

      const endTime = parseInt(localStorage.getItem('injectingEndTime') || '0', 10);
      const now = Date.now();
      const delay = endTime - now;

      if (delay <= 0) {
        triggerComplete();
      } else {
        globalState.completionTimer = setTimeout(triggerComplete, delay);
      }
    }

    function handleRequestAccept() {
      clearPendingRequest();
      closeAllModals();
      resetDashboardUrl();
    }

    function handleRequestClose() {
      clearCompletionSimulation();
      clearPendingRequest();
      closeAllModals();
      resetDashboardUrl();
    }

    function handleEmergencyConfirm() {
      console.log('BLE 명령 전송: 긴급 정지');
      clearCompletionSimulation();
      globalState.isInjecting = false;
      localStorage.setItem('isInjecting', 'false');
      localStorage.removeItem('injectingEndTime');
      updateInjectingBadge();
      clearPendingRequest();
      closeAllModals();
      resetDashboardUrl();
    }

    function handleCompleteConfirm() {
      clearCompletionSimulation();
      globalState.isInjecting = false;
      localStorage.setItem('isInjecting', 'false');
      localStorage.removeItem('injectingEndTime');
      updateInjectingBadge();
      clearPendingRequest();
      closeAllModals();
      resetDashboardUrl();
    }

    function applyRequestFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const modalType = params.get('modal');
      const action = params.get('action');
      const payload = params.get('payload');

      if (modalType === 'request' && action) {
        globalState.pendingAction = action;
        globalState.pendingPayload = payload;
        openModal('request');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const rawBattery = localStorage.getItem('batteryLevel');
      const rawInsulin = localStorage.getItem('insulinRemaining');

      const state = {
        dashboardData: {
          basal: localStorage.getItem('basalSum') || '---',
          meal: localStorage.getItem('mealSum') || '---',
          add: localStorage.getItem('appendSum') || '---',
          battery: (rawBattery === null || rawBattery === '---') ? '---' : parseInt(rawBattery, 10) * 25,
          insulinCurrent: (rawInsulin === null || rawInsulin === '---') ? '---' : parseFloat(rawInsulin),
          insulinMax: 300
        },
        isBluetoothConnected: true
      };

      const els = {
        valBasal: document.getElementById('val-basal'),
        valMeal: document.getElementById('val-meal'),
        valAdd: document.getElementById('val-add'),
        valBatteryPct: document.getElementById('val-battery-pct'),
        barBattery: document.getElementById('bar-battery'),
        valInsulin: document.getElementById('val-insulin'),
        barInsulin: document.getElementById('bar-insulin'),
        btnBluetooth: document.getElementById('btn-bluetooth'),
        btnRefresh: document.getElementById('btn-refresh'),
        btnEmergency: document.getElementById('btn-emergency'),
        btnEmergencyOk: document.getElementById('btn-modal-ok'),
        btnRequestOk: document.getElementById('btn-request-ok'),
        btnRequestClose: document.getElementById('btn-request-close'),
        btnCompleteOk: document.getElementById('btn-complete-ok')
      };

      function render() {
        const { dashboardData, isBluetoothConnected } = state;

        els.valBasal.textContent = dashboardData.basal;
        els.valMeal.textContent = dashboardData.meal;
        els.valAdd.textContent = dashboardData.add;

        if (dashboardData.battery === '---') {
          els.valBatteryPct.textContent = '---';
          els.barBattery.style.width = '0%';
        } else {
          els.valBatteryPct.textContent = `${dashboardData.battery}%`;
          els.barBattery.style.width = `${dashboardData.battery}%`;
        }

        if (dashboardData.insulinCurrent === '---') {
          els.valInsulin.textContent = '--- / 300 U';
          els.barInsulin.style.width = '0%';
        } else {
          els.valInsulin.textContent = `${dashboardData.insulinCurrent} / ${dashboardData.insulinMax} U`;
          const insulinPct = (dashboardData.insulinCurrent / dashboardData.insulinMax) * 100;
          els.barInsulin.style.width = `${Math.min(100, Math.max(0, insulinPct))}%`;
        }

        els.btnBluetooth.style.display = isBluetoothConnected ? 'block' : 'none';
      }

      els.btnRefresh.addEventListener('click', () => {
        els.btnRefresh.querySelector('span').classList.add('animate-spin');
        console.log("REQUEST_DASHBOARD_REFRESH");
        setTimeout(() => {
          els.btnRefresh.querySelector('span').classList.remove('animate-spin');
        }, 500);
      });

      els.btnEmergency.addEventListener('click', () => {
        openModal('emergency');
      });

      els.btnEmergencyOk.addEventListener('click', handleEmergencyConfirm);
      els.btnRequestOk.addEventListener('click', handleRequestAccept);
      els.btnRequestClose.addEventListener('click', handleRequestClose);
      els.btnCompleteOk.addEventListener('click', handleCompleteConfirm);

      // 토스트 메시지 대기 중인 경우 출력
      const pendingToast = localStorage.getItem('showToastMsg');
      if (pendingToast) {
        localStorage.removeItem('showToastMsg');
        showToast(pendingToast);
      }

      // 주입 상태 로드
      const isInjecting = localStorage.getItem('isInjecting') === 'true';
      if (isInjecting) {
        globalState.isInjecting = true;
        scheduleCompletionSimulation();
      } else {
        if (localStorage.getItem('showCompleteModal') === 'true') {
          localStorage.removeItem('showCompleteModal');
          openModal('complete');
        }
      }

      render();
      updateInjectingBadge();
      applyRequestFromQuery();

      // 외부 스토리지 변경 실시간 수신 (BLE 완료 처리 대응)
      window.addEventListener('storage', (e) => {
        if (e.key === 'isInjecting') {
          const updatedInjecting = localStorage.getItem('isInjecting') === 'true';
          if (!updatedInjecting && globalState.isInjecting) {
            // 다른 페이지에서 완료 처리 후 대시보드로 왔거나 실시간으로 완료된 경우
            clearCompletionSimulation();
            globalState.isInjecting = false;
            updateInjectingBadge();
            openModal('complete');
          } else if (updatedInjecting && !globalState.isInjecting) {
            globalState.isInjecting = true;
            updateInjectingBadge();
            scheduleCompletionSimulation();
          }
        }
        if (e.key === 'isInjecting' || e.key === 'injectingEndTime' || e.key === 'CONFIG_USE_TIMER') {
          scheduleCompletionSimulation();
        }
      });
    });
  </script>
</body></html>
