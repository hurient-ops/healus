<script>
  (function() {
    const CONFIG_USE_TIMER = true; 
    const isInjecting = localStorage.getItem('isInjecting') === 'true';
    const currentPath = window.location.pathname;
    const preventPaths = ['meal_injection', 'add_injection', 'dining', 'exercise'];
    const isPreventPath = preventPaths.some(path => currentPath.includes(path));
    
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-[13px] px-5 py-3 rounded-full shadow-lg z-[9999] transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-none whitespace-nowrap font-medium';
      toast.innerText = message;
      document.body.appendChild(toast);
      
      toast.offsetHeight;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }
    
    if (isInjecting && isPreventPath) {
      localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
      window.location.href = '../dashboard/code.html';
      return;
    }
    
    let activeTimer = null;
    
    function checkInjectingStatus() {
      const activeInjecting = localStorage.getItem('isInjecting') === 'true';
      if (!activeInjecting) {
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        return;
      }
      
      const endTime = parseInt(localStorage.getItem('injectingEndTime') || '0', 10);
      const now = Date.now();
      const useTimer = CONFIG_USE_TIMER && (localStorage.getItem('CONFIG_USE_TIMER') !== 'false');
      
      if (useTimer && endTime > 0) {
        if (now >= endTime) {
          triggerComplete();
        } else {
          const delay = endTime - now;
          if (activeTimer) clearTimeout(activeTimer);
          activeTimer = setTimeout(triggerComplete, delay);
        }
      }
    }
    
    function triggerComplete() {
      console.log('BLE 수신 시뮬레이션: BT_INJ_STOP_IND (0x3B) 주입 완료 수신');
      localStorage.setItem('isInjecting', 'false');
      localStorage.removeItem('injectingEndTime');
      localStorage.setItem('showCompleteModal', 'true');
      window.location.href = '../dashboard/code.html';
    }
    
    function init() {
      const pendingToast = localStorage.getItem('showToastMsg');
      if (pendingToast) {
        localStorage.removeItem('showToastMsg');
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => showToast(pendingToast));
        } else {
          showToast(pendingToast);
        }
      }
      checkInjectingStatus();
    }
    
    init();
    
    window.addEventListener('storage', (e) => {
      if (e.key === 'isInjecting') {
        const updatedInjecting = localStorage.getItem('isInjecting') === 'true';
        if (updatedInjecting && isPreventPath) {
          localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
          window.location.href = '../dashboard/code.html';
        } else if (!updatedInjecting && isInjecting && !isPreventPath) {
          localStorage.setItem('showCompleteModal', 'true');
          window.location.href = '../dashboard/code.html';
        }
      }
      if (e.key === 'isInjecting' || e.key === 'injectingEndTime' || e.key === 'CONFIG_USE_TIMER') {
        checkInjectingStatus();
      }
    });
  })();
</script>

<script>
    const defaultLanguage = { flag: '🇰🇷', lang: '한국어' };
    const langBtn = document.getElementById('language-select-btn');
    const langDropdown = document.getElementById('language-dropdown');
    const selectedLang = document.getElementById('selected-language');
    const langOptions = document.querySelectorAll('.lang-option');
    const saveButton = document.getElementById('save-language-btn');

    let currentLanguage = { ...defaultLanguage };

    function renderLanguage(language) {
        currentLanguage = { ...language };
        selectedLang.innerHTML = `<span class="text-xl">${language.flag}</span><span>${language.lang}</span>`;
    }

    function closeLanguageDropdown() {
        langDropdown.classList.add('hidden');
        langDropdown.classList.remove('flex');
    }

    function resetLanguageSelection() {
        renderLanguage(defaultLanguage);
        closeLanguageDropdown();
    }

    async function sendSelectedLanguageOverBluetooth(language) {
        if (!navigator.bluetooth) {
            console.info('Web Bluetooth is not available in this browser.');
            return false;
        }

        try {
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true
            });

            if (!device.gatt) {
                throw new Error('This Bluetooth device does not expose GATT services.');
            }

            const server = await device.gatt.connect();
            const services = await server.getPrimaryServices();

            for (const service of services) {
                const characteristics = await service.getCharacteristics();

                for (const characteristic of characteristics) {
                    if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                        const payload = JSON.stringify({
                            type: 'language_selection',
                            language: language.lang,
                            locale: language.lang === '한국어' ? 'ko' : language.lang === 'English' ? 'en' : language.lang === '中文' ? 'zh' : 'tr',
                            timestamp: new Date().toISOString()
                        });

                        await characteristic.writeValue(new TextEncoder().encode(payload));
                        return true;
                    }
                }
            }

            throw new Error('No writable Bluetooth characteristic was found.');
        } catch (error) {
            console.warn('Bluetooth transmission failed.', error);
            return false;
        }
    }

    async function saveSelectedLanguage() {
        saveButton.disabled = true;
        try {
            await sendSelectedLanguageOverBluetooth(currentLanguage);
        } finally {
            saveButton.disabled = false;
        }
    }

    function handleLanguageSelection(option) {
        const selectedLanguage = {
            flag: option.getAttribute('data-flag'),
            lang: option.getAttribute('data-lang')
        };

        renderLanguage(selectedLanguage);
        closeLanguageDropdown();
    }

    langBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        langDropdown.classList.toggle('hidden');
        langDropdown.classList.toggle('flex');
    });

    document.addEventListener('click', closeLanguageDropdown);

    langOptions.forEach(option => {
        option.addEventListener('click', (e) => {
            handleLanguageSelection(e.currentTarget);
        });
    });

    saveButton.addEventListener('click', saveSelectedLanguage);

    resetLanguageSelection();
</script>
