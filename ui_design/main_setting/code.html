<!DOCTYPE html><html lang="ko" style=""><head>
<script>
  (function() {
    const CONFIG_USE_TIMER = true; 
    const isInjecting = localStorage.getItem('isInjecting') === 'true';
    const currentPath = window.location.pathname;
    const preventPaths = ['meal_injection', 'add_injection', 'dining', 'exercise'];
    const isPreventPath = preventPaths.some(path => currentPath.includes(path));
    
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-[13px] px-5 py-3 rounded-full shadow-lg z-[9999] transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-none whitespace-nowrap font-medium';
      toast.innerText = message;
      document.body.appendChild(toast);
      
      toast.offsetHeight;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }
    
    if (isInjecting && isPreventPath) {
      localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
      window.location.href = '../dashboard/code.html';
      return;
    }
    
    let activeTimer = null;
    
    function checkInjectingStatus() {
      const activeInjecting = localStorage.getItem('isInjecting') === 'true';
      if (!activeInjecting) {
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        return;
      }
      
      const endTime = parseInt(localStorage.getItem('injectingEndTime') || '0', 10);
      const now = Date.now();
      const useTimer = CONFIG_USE_TIMER && (localStorage.getItem('CONFIG_USE_TIMER') !== 'false');
      
      if (useTimer && endTime > 0) {
        if (now >= endTime) {
          triggerComplete();
        } else {
          const delay = endTime - now;
          if (activeTimer) clearTimeout(activeTimer);
          activeTimer = setTimeout(triggerComplete, delay);
        }
      }
    }
    
    function triggerComplete() {
      console.log('BLE 수신 시뮬레이션: BT_INJ_STOP_IND (0x3B) 주입 완료 수신');
      localStorage.setItem('isInjecting', 'false');
      localStorage.removeItem('injectingEndTime');
      localStorage.setItem('showCompleteModal', 'true');
      window.location.href = '../dashboard/code.html';
    }
    
    function init() {
      const pendingToast = localStorage.getItem('showToastMsg');
      if (pendingToast) {
        localStorage.removeItem('showToastMsg');
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => showToast(pendingToast));
        } else {
          showToast(pendingToast);
        }
      }
      checkInjectingStatus();
    }
    
    init();
    
    window.addEventListener('storage', (e) => {
      if (e.key === 'isInjecting') {
        const updatedInjecting = localStorage.getItem('isInjecting') === 'true';
        if (updatedInjecting && isPreventPath) {
          localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
          window.location.href = '../dashboard/code.html';
        } else if (!updatedInjecting && isInjecting && !isPreventPath) {
          localStorage.setItem('showCompleteModal', 'true');
          window.location.href = '../dashboard/code.html';
        }
      }
      if (e.key === 'isInjecting' || e.key === 'injectingEndTime' || e.key === 'CONFIG_USE_TIMER') {
        checkInjectingStatus();
      }
    });
  })();
</script>

<script type="text/babel">
  const { useState } = React;

  function SettingsScreen() {
    const [isPaused, setIsPaused] = useState(() => localStorage.getItem('isPaused') === 'true');
    const [activeModal, setActiveModal] = useState(null);

    React.useEffect(() => {
      window.globalState = window.globalState || { activeModal: null };

      if (activeModal) {
        window.closeAllModals = () => setActiveModal(null);
      } else {
        window.closeAllModals = () => {};
      }
    }, [activeModal]);

    const sendBLECommand = (command) => {
      console.log(`BLE Command Sent: [${command}]`);
    };

    const handleConfirmPause = () => {
      setIsPaused(true);
      sendBLECommand('PAUSE');
      setActiveModal(null);
    };

    const handleConfirmResume = () => {
      setIsPaused(false);
      sendBLECommand('RESUME');
      setActiveModal(null);
    };

    const handleConfirmDisconnect = () => {
      sendBLECommand('DISCONNECT');
      setActiveModal(null);
    };

    const handleConfirmReset = () => {
      sendBLECommand('RESET');
      setActiveModal('reset_success');
    };

    return (
      <div className="w-full h-full bg-surface-container-lowest flex flex-col">
        <div className="h-2 bg-surface-container-lowest w-full shrink-0 z-10"></div>

        <header className="h-14 bg-surface-container-lowest flex items-center justify-between px-4 border-b border-outline-variant shrink-0">

              onClick={() => window.location.reload()}
            >
              <span className="material-symbols-outlined text-[#509194]">sync</span>
            </div>
            <div className="flex items-center hover:bg-teal-50 dark:hover:bg-teal-900/30 transition-colors active:scale-95 transition-transform duration-150 p-2 rounded-full cursor-pointer">
              <span className="material-symbols-outlined text-[#509194]">bluetooth</span>
            </div>
          </div>
        </header>

        <main className="flex-1 overflow-y-auto no-scrollbar bg-surface-container-lowest pb-[64px]">
          <section>
            <div className="bg-surface-container-low px-4 py-1.5 border-b border-outline-variant">
              <h2 className="text-[13px] font-semibold text-on-surface-variant">기초</h2>
            </div>
            <ul className="flex flex-col">
              <li className="border-b border-outline-variant">
                <a href="../basal_setting/code.html" className="block w-full text-left px-4 py-3 text-[14px] font-medium text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors cursor-pointer">
                  기초 설정
                </a>
              </li>
              <li className="border-b border-outline-variant">
                <button
                  className="w-full text-left px-4 py-3 text-[14px] font-medium text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors"
                  onClick={() => setActiveModal(isPaused ? 'resume' : 'pause')}
                >
                  {isPaused ? '장치 재개' : '일시 정지'}
                </button>
              </li>
            </ul>
          </section>

          <section>
            <div className="bg-surface-container-low px-4 py-1.5 border-b border-outline-variant mt-1">
              <h2 className="text-[13px] font-semibold text-on-surface-variant">식사</h2>
            </div>
            <ul className="flex flex-col">
              <li className="border-b border-outline-variant">
                <a href="../meal_setting/code.html" className="block w-full text-left px-4 py-3 text-[14px] font-medium text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors cursor-pointer">

          <section>

              <h2 className="text-[13px] font-semibold text-on-surface-variant">장치</h2>

            </div>
            <ul className="flex flex-col">

                  className="w-full text-left px-4 py-3 text-[14px] font-medium text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors"
                  onClick={() => setActiveModal('disconnect')}

              <li className="border-b border-outline-variant">
                <button
                  className="w-full text-left px-4 py-3 text-[14px] font-medium text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors"
                  onClick={() => setActiveModal('reset')}
                >
                  장치 초기화
                </button>
              </li>
            </ul>
          </section>

          <section>
            <div className="bg-surface-container-low px-4 py-1.5 border-b border-outline-variant mt-1">
              <h2 className="text-[13px] font-semibold text-on-surface-variant">앱</h2>
            </div>
            <ul className="flex flex-col">

                </a>
              </li>
            </ul>
          </section>

          <div className="px-4 py-3 flex-1 flex flex-col justify-end">
            <div className="w-full overflow-hidden rounded-lg aspect-[1376/580] max-h-[80px]">

                alt="Device Image"

                style={{ imageRendering: '-webkit-optimize-contrast', objectFit: 'cover', objectPosition: 'center' }}

          </div>
        </main>

        <nav className="absolute bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant h-[60px] flex items-center justify-around px-4 z-50">
          <a
            className="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors cursor-pointer decoration-none"
            onClick={() => {

            <span className="text-[10px] font-medium font-label">홈</span>
          </a>
          <button className="flex flex-col items-center gap-1 text-primary">
            <span className="material-symbols-outlined text-[24px]" style={{ fontVariationSettings: '"FILL" 1' }}>settings</span>

          <a

        {activeModal && (

              {activeModal === 'pause' && (
                <>

                  <div className="flex gap-3 mt-4 justify-center">
                    <button className="flex-1 bg-[#2A6062] text-white py-3 rounded-full font-semibold hover:opacity-90 transition-opacity active:scale-95" onClick={handleConfirmPause}>예</button>
                    <button className="flex-1 bg-[#2A6062] text-white py-3 rounded-full font-semibold hover:opacity-90 transition-opacity active:scale-95" onClick={() => setActiveModal(null)}>아니요</button>
                  </div>
                </>
              )}

              {activeModal === 'resume' && (
                <>
                  <h2 className="text-[24px] font-bold text-on-surface text-center">장치 재개?</h2>
                  <div className="flex gap-3 mt-4 justify-center">
                    <button className="flex-1 bg-[#2A6062] text-white py-3 rounded-full font-semibold hover:opacity-90 transition-opacity active:scale-95" onClick={handleConfirmResume}>예</button>
                    <button className="flex-1 bg-[#2A6062] text-white py-3 rounded-full font-semibold hover:opacity-90 transition-opacity active:scale-95" onClick={() => setActiveModal(null)}>아니요</button>
                  </div>
                </>
              )}

              {activeModal === 'disconnect' && (
                <>
                  <h2 className="text-[24px] font-bold text-on-surface text-center">장치 연결 해제</h2>
                  <p className="text-center text-on-surface-variant">장치 연결을 해제하시겠습니까?</p>
                  <div className="flex gap-3 mt-4 justify-center">
                    <button className="flex-1 bg-[#2A6062] text-white py-3 rounded-full font-semibold hover:opacity-90 transition-opacity active:scale-95" onClick={handleConfirmDisconnect}>예</button>
                    <button className="flex-1 bg-[#2A6062] text-white py-3 rounded-full font-semibold hover:opacity-90 transition-opacity active:scale-95" onClick={() => setActiveModal(null)}>아니요</button>
                  </div>
                </>
              )}

              {activeModal === 'reset' && (
                <>
                  <h2 className="text-[24px] font-bold text-on-surface text-center">장치 초기화</h2>
                  <p className="text-center text-on-surface-variant">장치를 초기화하시겠습니까?</p>
                  <div className="flex gap-3 mt-4 justify-center">
                    <button className="flex-1 bg-[#2A6062] text-white py-3 rounded-full font-semibold hover:opacity-90 transition-opacity active:scale-95" onClick={handleConfirmReset}>예</button>
                    <button className="flex-1 bg-[#2A6062] text-white py-3 rounded-full font-semibold hover:opacity-90 transition-opacity active:scale-95" onClick={() => setActiveModal(null)}>아니요</button>
                  </div>
                </>
              )}

              {activeModal === 'reset_success' && (
                <>
                  <h2 className="text-[24px] font-bold text-on-surface text-center">장치 초기화</h2>
                  <p className="text-center text-on-surface-variant">초기화가 완료되었습니다.</p>
                  <div className="flex gap-3 mt-4 justify-center">
                    <button className="w-full bg-[#2A6062] text-white py-3 rounded-full font-semibold hover:opacity-90 transition-opacity active:scale-95" onClick={() => setActiveModal(null)}>OK</button>
                  </div>
                </>
              )}
            </div>
          </div>
        )}
      </div>
    );
  }

  function renderSettings() {
    const container = document.getElementById('root');
    if (!container) {
      return;
    }

    container.innerHTML = '';
    const root = ReactDOM.createRoot(container);
    root.render(<SettingsScreen />);
  }

  function checkSavedModal() {
    const savedType = localStorage.getItem('showSettingSaved');
    if (savedType) {
      localStorage.removeItem('showSettingSaved');
      const modalType = savedType === 'meal' ? '식사 설정' : '기초 설정';
      const modal = document.createElement('div');
      modal.id = 'basal-save-modal';
      modal.className = 'fixed inset-0 z-[200] flex items-center justify-center bg-black/50 px-4';
      modal.innerHTML = `
        <div class="w-full max-w-[320px] rounded-[28px] bg-surface-container-lowest px-6 py-7 shadow-2xl text-center">
          <p class="text-[26px] font-extrabold text-on-surface tracking-tight">${modalType}</p>
          <p class="mt-3 text-[15px] text-on-surface-variant leading-6">설정이 저장되었습니다.</p>
          <button id="basal-save-ok" class="mt-6 w-full rounded-full bg-[#1f6568] px-4 py-3 text-[16px] font-bold text-white shadow-md active:scale-95 transition-all">OK</button>
        </div>
      `;

      document.body.appendChild(modal);

      const okButton = document.getElementById('basal-save-ok');
      
      window.globalState = window.globalState || { activeModal: null };
      window.globalState.activeModal = 'save-modal';
      
      const closeModalFunc = () => {
        if (document.getElementById('basal-save-modal')) {
          modal.remove();
        }
        window.globalState.activeModal = null;
        window.closeAllModals = () => {};
      };

      window.closeAllModals = closeModalFunc;
      okButton.addEventListener('click', closeModalFunc);
    }
  }

  // Run on load
  checkSavedModal();

  // Run on pageshow (in case of bfcache)
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) {
      renderSettings();
      checkSavedModal();
    } else {
      renderSettings();
    }
  });
</script>
