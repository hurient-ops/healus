<script>
  (function() {
    const CONFIG_USE_TIMER = true; 
    const isInjecting = localStorage.getItem('isInjecting') === 'true';
    const currentPath = window.location.pathname;
    const preventPaths = ['meal_injection', 'add_injection', 'dining', 'exercise'];
    const isPreventPath = preventPaths.some(path => currentPath.includes(path));
    
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-[13px] px-5 py-3 rounded-full shadow-lg z-[9999] transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-none whitespace-nowrap font-medium';
      toast.innerText = message;
      document.body.appendChild(toast);
      
      toast.offsetHeight;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }
    
    if (isInjecting && isPreventPath) {
      localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
      window.location.href = '../dashboard/code.html';
      return;
    }
    
    let activeTimer = null;
    
    function checkInjectingStatus() {
      const activeInjecting = localStorage.getItem('isInjecting') === 'true';
      if (!activeInjecting) {
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        return;
      }
      
      const endTime = parseInt(localStorage.getItem('injectingEndTime') || '0', 10);
      const now = Date.now();
      const useTimer = CONFIG_USE_TIMER && (localStorage.getItem('CONFIG_USE_TIMER') !== 'false');
      
      if (useTimer && endTime > 0) {
        if (now >= endTime) {
          triggerComplete();
        } else {
          const delay = endTime - now;
          if (activeTimer) clearTimeout(activeTimer);
          activeTimer = setTimeout(triggerComplete, delay);
        }
      }
    }
    
    function triggerComplete() {
      console.log('BLE 수신 시뮬레이션: BT_INJ_STOP_IND (0x3B) 주입 완료 수신');
      localStorage.setItem('isInjecting', 'false');
      localStorage.removeItem('injectingEndTime');
      localStorage.setItem('showCompleteModal', 'true');
      window.location.href = '../dashboard/code.html';
    }
    
    function init() {
      const pendingToast = localStorage.getItem('showToastMsg');
      if (pendingToast) {
        localStorage.removeItem('showToastMsg');
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => showToast(pendingToast));
        } else {
          showToast(pendingToast);
        }
      }
      checkInjectingStatus();
    }
    
    init();
    
    window.addEventListener('storage', (e) => {
      if (e.key === 'isInjecting') {
        const updatedInjecting = localStorage.getItem('isInjecting') === 'true';
        if (updatedInjecting && isPreventPath) {
          localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
          window.location.href = '../dashboard/code.html';
        } else if (!updatedInjecting && isInjecting && !isPreventPath) {
          localStorage.setItem('showCompleteModal', 'true');
          window.location.href = '../dashboard/code.html';
        }
      }
      if (e.key === 'isInjecting' || e.key === 'injectingEndTime' || e.key === 'CONFIG_USE_TIMER') {
        checkInjectingStatus();
      }
    });
  })();
</script>

<script>
  const STORAGE_KEY = 'meal_settings';
  const DEFAULT_MEAL_VALUES = {
    breakfast: '1.00',
    lunch: '1.00',
    dinner: '1.00'
  };

  const targets = {
    breakfast: ['breakfast-int', 'breakfast-dec'],
    lunch: ['lunch-int', 'lunch-dec'],
    dinner: ['dinner-int', 'dinner-dec']
  };

  function normalizeMealValue(value) {
    const parsed = String(value || '1.00');
    const [intPart = '1', decPart = '00'] = parsed.split('.');
    return `${intPart}.${decPart.padEnd(2, '0')}`;
  }

  function loadSavedMealSettings() {
    try {
      const saved = window.localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        return DEFAULT_MEAL_VALUES;
      }

      const parsed = JSON.parse(saved);
      if (!parsed || typeof parsed !== 'object') {
        return DEFAULT_MEAL_VALUES;
      }

      return {
        breakfast: normalizeMealValue(parsed.breakfast),
        lunch: normalizeMealValue(parsed.lunch),
        dinner: normalizeMealValue(parsed.dinner)
      };
    } catch (error) {
      return DEFAULT_MEAL_VALUES;
    }
  }

  function applyMealValues(values) {
    Object.entries(values).forEach(([key, value]) => {
      const [intId, decId] = targets[key];
      const intEl = document.getElementById(intId);
      const decEl = document.getElementById(decId);
      const [intValue = '1', decValue = '00'] = String(value).split('.');

      if (intEl) {
        intEl.value = String(intValue);
      }

      if (decEl) {
        decEl.value = decValue.padEnd(2, '0');
      }
    });
  }

  function getCurrentMealValues() {
    return {
      breakfast: `${document.getElementById('breakfast-int').value}.${document.getElementById('breakfast-dec').value}`,
      lunch: `${document.getElementById('lunch-int').value}.${document.getElementById('lunch-dec').value}`,
      dinner: `${document.getElementById('dinner-int').value}.${document.getElementById('dinner-dec').value}`
    };
  }

  function saveMealValues(values) {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
  }

  function applyBleMealData(values) {
    if (!values || typeof values !== 'object') {
      return;
    }

    const normalized = {
      breakfast: normalizeMealValue(values.breakfast),
      lunch: normalizeMealValue(values.lunch),
      dinner: normalizeMealValue(values.dinner)
    };

    saveMealValues(normalized);
    applyMealValues(normalized);
  }

  window.receiveBleMealData = applyBleMealData;

  document.getElementById('save-btn').addEventListener('click', function () {
    const values = getCurrentMealValues();
    saveMealValues(values);
    
    // BLE 패킷 송출 시뮬레이션 로그 출력
    console.log(`BLE 명령 전송: BT_MEAL_SET_REQ (0x10) - 아침: ${values.breakfast} U, 점심: ${values.lunch} U, 저녁: ${values.dinner} U 설정 전송`);
    
    setTimeout(() => {
      window.location.href = '../main_setting/code.html?saved=1&type=meal';
    }, 150);
  });

  const savedValues = loadSavedMealSettings();
  applyMealValues(savedValues);

  document.addEventListener('DOMContentLoaded', () => {
    // 네이티브 공통 식사설정 상태 요청
    console.log('REQUEST_MEAL_RATES');
  });
</script>
