<script>
  (function() {
    const CONFIG_USE_TIMER = true; 
    const isInjecting = localStorage.getItem('isInjecting') === 'true';
    const currentPath = window.location.pathname;
    const preventPaths = ['meal_injection', 'add_injection', 'dining', 'exercise'];
    const isPreventPath = preventPaths.some(path => currentPath.includes(path));
    
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-[13px] px-5 py-3 rounded-full shadow-lg z-[9999] transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-none whitespace-nowrap font-medium';
      toast.innerText = message;
      document.body.appendChild(toast);
      
      toast.offsetHeight;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }
    
    if (isInjecting && isPreventPath) {
      localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
      window.location.href = '../dashboard/code.html';
      return;
    }
    
    let activeTimer = null;
    
    function checkInjectingStatus() {
      const activeInjecting = localStorage.getItem('isInjecting') === 'true';
      if (!activeInjecting) {
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        return;
      }
      
      const endTime = parseInt(localStorage.getItem('injectingEndTime') || '0', 10);
      const now = Date.now();
      const useTimer = CONFIG_USE_TIMER && (localStorage.getItem('CONFIG_USE_TIMER') !== 'false');
      
      if (useTimer && endTime > 0) {
        if (now >= endTime) {
          triggerComplete();
        } else {
          const delay = endTime - now;
          if (activeTimer) clearTimeout(activeTimer);
          activeTimer = setTimeout(triggerComplete, delay);
        }
      }
    }
    
    function triggerComplete() {
      console.log('BLE 수신 시뮬레이션: BT_INJ_STOP_IND (0x3B) 주입 완료 수신');
      localStorage.setItem('isInjecting', 'false');
      localStorage.removeItem('injectingEndTime');
      localStorage.setItem('showCompleteModal', 'true');
      window.location.href = '../dashboard/code.html';
    }
    
    function init() {
      const pendingToast = localStorage.getItem('showToastMsg');
      if (pendingToast) {
        localStorage.removeItem('showToastMsg');
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => showToast(pendingToast));
        } else {
          showToast(pendingToast);
        }
      }
      checkInjectingStatus();
    }
    
    init();
    
    window.addEventListener('storage', (e) => {
      if (e.key === 'isInjecting') {
        const updatedInjecting = localStorage.getItem('isInjecting') === 'true';
        if (updatedInjecting && isPreventPath) {
          localStorage.setItem('showToastMsg', '주입 중에서 수행할 수 없습니다');
          window.location.href = '../dashboard/code.html';
        } else if (!updatedInjecting && isInjecting && !isPreventPath) {
          localStorage.setItem('showCompleteModal', 'true');
          window.location.href = '../dashboard/code.html';
        }
      }
      if (e.key === 'isInjecting' || e.key === 'injectingEndTime' || e.key === 'CONFIG_USE_TIMER') {
        checkInjectingStatus();
      }
    });
  })();
</script>

<body class="bg-background font-body-md text-on-background flex flex-col mx-auto" data-mode="connect">
<div class="flex flex-col h-full w-full" id="root"></div>
<script type="text/babel">
  const { useState, createContext, useContext } = React;
  const { MemoryRouter, Routes, Route, useNavigate } = ReactRouterDOM;

  // 1. 전역 상태 관리 가동: 'InjectionContext'
  const InjectionContext = createContext();

  const InjectionProvider = ({ children }) => {
    const [isInjecting, setIsInjecting] = useState(false);
    
    const startInjection = () => {
      setIsInjecting(true);
    };

    return (
      <InjectionContext.Provider value={{ isInjecting, startInjection }}>
        {children}
      </InjectionContext.Provider>
    );
  };

  const MealInjectionScreen = () => {
    const [breakfast, setBreakfast] = useState('1.00');
    const [lunch, setLunch] = useState('1.00');
    const [dinner, setDinner] = useState('1.00');

    React.useEffect(() => {
      try {
        const saved = window.localStorage.getItem('meal_settings');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.breakfast) setBreakfast(parsed.breakfast);
          if (parsed.lunch) setLunch(parsed.lunch);
          if (parsed.dinner) setDinner(parsed.dinner);
        }
      } catch (e) {
        console.error('Failed to load meal settings', e);
      }
    }, []);

    const handleInjectClick = () => {
      const payload = encodeURIComponent(JSON.stringify({
        breakfast: breakfast,
        lunch: lunch,
        dinner: dinner
      }));

      window.location.href = `../dashboard/code.html?modal=request&action=meal&payload=${payload}`;
    };

    const handleCloseClick = () => {
      window.location.href = '../dashboard/code.html';
    };

    return (
      <React.Fragment>
        {/* TopAppBar */}
        <div className="h-14 shrink-0"></div>
        
        {/* Main Scrollable Content */}
        <main className="flex-1 overflow-y-auto px-margin-mobile pt-3 pb-1">
          {/* Screen Title Section */}
          <section className="mb-4">
            <h2 className="font-headline-md text-[22px] text-on-surface font-semibold">식사 주입</h2>
          </section>
          
          {/* Instruction Info Box */}
          <section className="mb-5">
            <div className="bg-[#F2F7F7] border border-[#E0E7E7] rounded-[16px] p-4 flex gap-2">
              <div className="flex gap-2 w-full">
                <span className="material-symbols-outlined text-[#2A6062] text-xl mt-0.5" data-icon="info">info</span>
                <div className="flex-1">
                  <div className="flex items-center mb-1">
                    <p className="font-label-sm text-[13px] text-[#2A6062] font-semibold">안전 수칙</p>
                  </div>
                  <p className="font-body-md text-[13px] text-on-surface-variant leading-[1.6]">
                    식사주입은 설정한 인슐린 단위수(unit) 만큼 주입<br />
                    - 식사 주입 1회 주입 완료 후 <span className="font-bold text-[#2A6062]">"2시간, 3시간"</span> 주기로 <br />
                    제한하여 주입가능 (과다주입, 저혈당 쇼크 방지)<br />
                    - 식사 설정에 설정된 단위수를 식사 주입 메뉴로 이동, 수정하여 가감된 단위수를 주입할 수 있음
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* Input Fields */}
          <div className="flex flex-col gap-3 mb-6">
            {/* Breakfast Card */}
            <div className="bg-white border border-[#E0E7E7] rounded-[16px] p-4 flex items-center gap-4">
              <div className="flex items-center gap-2 w-20 shrink-0">
                <span className="material-symbols-outlined text-[#2A6062] text-[20px]" data-icon="wb_twilight">wb_twilight</span>
                <h3 className="font-label-sm text-[15px] text-[#191C1D] font-medium">아침</h3>
              </div>
              <div className="relative flex-1">
                <div className="flex items-center bg-[#F8FAFA] border border-[#E0E7E7] rounded-xl overflow-hidden px-4 py-2.5">
                  <input className="w-full bg-transparent border-none p-0 text-base font-medium text-[#191C1D] outline-none" placeholder="1.00" readOnly step="0.01" type="number" value={breakfast} />
                  <span className="font-label-sm text-[13px] text-on-surface-variant shrink-0 ml-2">단위 (U)</span>
                </div>
              </div>
            </div>
            
            {/* Lunch Card */}
            <div className="bg-white border border-[#E0E7E7] rounded-[16px] p-4 flex items-center gap-4">
              <div className="flex items-center gap-2 w-20 shrink-0">
                <span className="material-symbols-outlined text-[#AB2C5D] text-[20px]" data-icon="light_mode">light_mode</span>
                <h3 className="font-label-sm text-[15px] text-[#191C1D] font-medium">점심</h3>
              </div>
              <div className="relative flex-1">
                <div className="flex items-center bg-[#F8FAFA] border border-[#E0E7E7] rounded-xl overflow-hidden px-4 py-2.5">
                  <input className="w-full bg-transparent border-none p-0 text-base font-medium text-[#191C1D] outline-none" placeholder="1.00" readOnly step="0.01" type="number" value={lunch} />
                  <span className="font-label-sm text-[13px] text-on-surface-variant shrink-0 ml-2">단위 (U)</span>
                </div>
              </div>
            </div>
            
            {/* Dinner Card */}
            <div className="bg-white border border-[#E0E7E7] rounded-[16px] p-4 flex items-center gap-4">
              <div className="flex items-center gap-2 w-20 shrink-0">
                <span className="material-symbols-outlined text-[#677877] text-[20px]" data-icon="bedtime">bedtime</span>
                <h3 className="font-label-sm text-[15px] text-[#191C1D] font-medium">저녁</h3>
              </div>
              <div className="relative flex-1">
                <div className="flex items-center bg-[#F8FAFA] border border-[#E0E7E7] rounded-xl overflow-hidden px-4 py-2.5">
                  <input className="w-full bg-transparent border-none p-0 text-base font-medium text-[#191C1D] outline-none" placeholder="1.00" readOnly step="0.01" type="number" value={dinner} />
                  <span className="font-label-sm text-[13px] text-on-surface-variant shrink-0 ml-2">단위 (U)</span>
                </div>
              </div>
            </div>
          </div>
          
          {/* Visual Context Image */}
          <div className="mb-2 rounded-2xl overflow-hidden h-28 relative group">
            <img alt="Healthy fresh meal" className="w-full h-full object-cover" data-alt="top-down view of a colorful mediterranean salad with chickpeas and fresh vegetables on a white plate in soft natural daylight" src="./images/meal_injection.png" />
            <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
            <div className="absolute bottom-4 left-4">
              <p className="text-white font-label-sm text-[13px] font-medium tracking-wide">섭취량에 맞게 주입량을 조절하세요</p>
            </div>
          </div>
        </main>
        
        {/* Fixed Bottom Actions */}
        <footer className="shrink-0 bg-background ios-bottom-padding pt-4 pb-8">
          <div className="px-margin-mobile flex gap-3 flex-row">
            <button 
              onClick={handleInjectClick}
              className="w-full bg-[#2A6062] text-white py-4 rounded-full font-headline-md text-[15px] font-medium active:scale-[0.98] transition-transform flex items-center justify-center flex-1"
            >
              주입하기
            </button>
            <button 
              onClick={handleCloseClick}
              className="w-full bg-[#E1E3E3] text-[#3F4849] py-4 rounded-full font-headline-md text-[15px] font-medium hover:bg-surface-dim transition-colors active:scale-[0.98] flex-1 flex items-center justify-center"
            >
              닫기
            </button>
          </div>
        </footer>
      </React.Fragment>
    );
  };

  const App = () => {
    return (
      <InjectionProvider>
        <MemoryRouter initialEntries={['/meal-injection']}>
          <Routes>
            <Route path="/meal-injection" element={<MealInjectionScreen />} />
            <Route path="/" element={<div className="flex items-center justify-center h-full"><h1 className="text-xl">대시보드 (Mock)</h1></div>} />
          </Routes>
        </MemoryRouter>
      </InjectionProvider>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
