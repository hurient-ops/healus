    - ui_design/battery_change/
    - ui_design/battery_change/images/
    - ui_design/ble_connect/
    - ui_design/dashboard/
    - ui_design/dashboard/images/
    - ui_design/dining/
    - ui_design/dining/images/
    - ui_design/exercise/
    - ui_design/exercise/images/
    - ui_design/guidelines/
    - ui_design/guidelines/images/
    - ui_design/history/
    - ui_design/infomation/
    - ui_design/infomation/images/
    - ui_design/infusionset_change/
    - ui_design/infusionset_change/images/
    - ui_design/language_setting/
    - ui_design/language_setting/images/
    - ui_design/main_setting/
    - ui_design/main_setting/images/
    - ui_design/meal_injection/
    - ui_design/meal_injection/images/
    - ui_design/meal_setting/
    - ui_design/meal_setting/images/
    - ui_design/password/
